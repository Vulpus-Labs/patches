[package]
name = "patches-dsp"
version = "0.6.1"
edition = "2021"
rust-version = "1.80"
description = "Pure DSP kernels (filters, oscillators, delay, resampling, fast math) for the Patches modular-audio framework."
license = "MIT"
repository = "https://github.com/Vulpus-Labs/patches"
readme = "README.md"
keywords = ["audio", "dsp", "filter", "synthesizer", "music"]
categories = ["multimedia::audio"]

[lib]
name = "patches_dsp"
path = "src/lib.rs"
doctest = false

[dependencies]
# (none) — patches-dsp is the workspace's pure-DSP leaf crate. Keep it
# dependency-free; the patches-forbidden-edges allowlist permits only
# `rtrb` should a lock-free ring buffer ever be needed here (ticket 1001).
