name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js (for patches-clap JS bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build patch_player
        shell: bash
        run: cargo build --release -p patches-player

      - name: Build CLAP plugin
        # Bundle ships two descriptors (Patches + Patches FX) so the
        # plugin shows up in both instrument and effect slots. One
        # dylib — no extra build steps.
        shell: bash
        run: cargo build --release -p patches-clap

      - name: List target/release
        shell: bash
        run: ls -la target/release/

      - name: Stage artifacts
        # Bundle cdylibs (patches-vintage, patches-drums,
        # patches-fft-bundle) ship from the patches-bundles repo and
        # are not yet wired in here — see ticket 0891.
        shell: bash
        run: |
          set -e
          mkdir -p staging
          cp target/release/patch_player.exe staging/
          cp target/release/patches_clap.dll staging/Patches.clap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: staging/*
          if-no-files-found: error

  build-macos:
    name: Build macOS binaries (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js (for patches-clap JS bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build patch_player + CLAP plugin
        # Bundle cdylibs (patches-vintage, patches-drums,
        # patches-fft-bundle) ship from the patches-bundles repo
        # and are not yet wired in here — see ticket 0891.
        run: |
          cargo build --release -p patches-player --target ${{ matrix.target }}
          cargo build --release -p patches-clap   --target ${{ matrix.target }}

      - name: Stage and ad-hoc sign
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/patch_player           staging/
          cp target/${{ matrix.target }}/release/libpatches_clap.dylib  staging/Patches.clap
          codesign --sign - staging/patch_player
          codesign --sign - staging/Patches.clap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error

  build-vsix:
    name: Build VSIX (${{ matrix.vscode-target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - vscode-target: darwin-arm64
            cargo-target: aarch64-apple-darwin
            runner: macos-latest
            binary: patches-lsp
          - vscode-target: darwin-x64
            cargo-target: x86_64-apple-darwin
            runner: macos-13
            binary: patches-lsp
          - vscode-target: win32-x64
            cargo-target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: patches-lsp.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Build patches-lsp
        run: cargo build --release -p patches-lsp --target ${{ matrix.cargo-target }}

      - name: Ad-hoc sign binary (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - target/${{ matrix.cargo-target }}/release/${{ matrix.binary }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare extension
        working-directory: patches-vscode
        run: |
          npm ci --ignore-scripts
          npx tsc -p ./

      - name: Copy LSP binary into extension
        shell: bash
        run: |
          mkdir -p patches-vscode/server
          cp target/${{ matrix.cargo-target }}/release/${{ matrix.binary }} patches-vscode/server/

      - name: Package VSIX
        working-directory: patches-vscode
        run: npx @vscode/vsce package --target ${{ matrix.vscode-target }} -o ../

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vscode-target }}
          path: "*.vsix"
          if-no-files-found: error

  build-windows-msi:
    name: Build Windows MSI
    # Skip on prerelease tags (e.g. v0.7.3-rc.1). Windows Installer
    # Version is strictly numeric MAJOR.MINOR.BUILD — SemVer prerelease
    # suffixes are rejected by cargo-wix --install-version.
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [build-windows, build-docs]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked --version "^0.3"

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x86_64
          path: artifacts/windows

      - name: Download docs PDF
        uses: actions/download-artifact@v4
        with:
          name: release-docs-pdf
          path: artifacts/docs

      - name: Stage MSI inputs
        # MSI sources are resolved relative to candle.exe's cwd (the
        # patches-player package dir), so everything is staged under
        # patches-player/wix/staging/. CLAUDE.md sits next to the
        # example .patches files but is editor scaffolding, not user
        # content — strip it so it doesn't end up in Public Documents.
        shell: bash
        run: |
          set -e
          STAGE=patches-player/wix/staging
          mkdir -p "$STAGE/examples"
          cp artifacts/windows/patch_player.exe "$STAGE/"
          cp artifacts/windows/Patches.clap     "$STAGE/"
          cp artifacts/docs/patches-manual.pdf  "$STAGE/"
          cp LICENSE                            "$STAGE/LICENSE.txt"
          cp -r examples/. "$STAGE/examples/"
          rm -f "$STAGE/examples/CLAUDE.md"

      - name: Harvest examples with heat
        # Generates patches-player/wix/examples.wxs containing the
        # ComponentGroup CG.Examples referenced by main.wxs. Using a
        # var.ExamplesSource indirection so the heat-time path and
        # candle-time path can differ if we ever re-stage.
        shell: pwsh
        run: |
          $heat = Join-Path $env:WIX 'bin\heat.exe'
          & $heat dir 'patches-player\wix\staging\examples' `
            -nologo `
            -cg CG.Examples `
            -dr PubDocsPatchesExamples `
            -var var.ExamplesSource `
            -gg -g1 -sfrag -srd -scom -sreg `
            -out 'patches-player\wix\examples.wxs'

      - name: Build MSI
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = $env:REF_NAME -replace '^v',''
          $msi = "patches-$ver-windows-x86_64.msi"
          cargo wix `
            --package patches-player `
            --no-build `
            --nocapture `
            --install-version $ver `
            -C '-arch' -C 'x64' `
            -C '-dStagingDir=wix\staging' `
            -C '-dExamplesSource=wix\staging\examples' `
            -C '-dIconSource=..\assets\patches.ico' `
            -o "$msi"
          # Move to a predictable artifact location.
          New-Item -ItemType Directory -Force -Path msi-out | Out-Null
          Move-Item $msi msi-out\

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-msi
          path: msi-out/*.msi
          if-no-files-found: error

  build-docs:
    name: Build PDF docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook and mdbook-pandoc
        run: cargo install mdbook mdbook-pandoc --locked

      - name: Install Pandoc
        run: |
          curl -sSL https://github.com/jgm/pandoc/releases/download/3.2/pandoc-3.2-linux-amd64.tar.gz \
            | tar -xz --strip-components=2 --directory /usr/local/bin pandoc-3.2/bin/pandoc

      - name: Install Tectonic
        run: |
          curl -sSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --directory /usr/local/bin

      - name: Build docs
        working-directory: docs
        run: mdbook build

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-docs-pdf
          path: docs/book/pandoc/pdf/patches-manual.pdf
          if-no-files-found: error

  package-and-release:
    name: Package and publish release
    # build-windows-msi is a need so we don't race it on stable tags;
    # the `if` below tolerates its skipped state on prerelease tags
    # (where MSI is intentionally not built — see that job's `if`).
    needs: [build-windows, build-windows-msi, build-macos, build-vsix, build-docs]
    if: >-
      always()
      && needs.build-windows.result == 'success'
      && needs.build-macos.result == 'success'
      && needs.build-vsix.result == 'success'
      && needs.build-docs.result == 'success'
      && (needs.build-windows-msi.result == 'success'
          || needs.build-windows-msi.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          VERSION_BARE="${VERSION#v}"

          stage_common() {
            local DIR="$1"
            mkdir -p "${DIR}/examples"
            cp artifacts/release-docs-pdf/patches-manual.pdf "${DIR}/"
            cp -r examples/* "${DIR}/examples/"
          }

          # Windows zip
          WIN_DIR="patches-${VERSION_BARE}-windows-x86_64"
          mkdir -p "${WIN_DIR}"
          cp artifacts/release-windows-x86_64/* "${WIN_DIR}/"
          cp artifacts/vsix-win32-x64/*.vsix "${WIN_DIR}/" || true
          stage_common "${WIN_DIR}"
          zip -r "${WIN_DIR}.zip" "${WIN_DIR}"

          # macOS aarch64
          MAC_ARM_DIR="patches-${VERSION_BARE}-macos-aarch64"
          mkdir -p "${MAC_ARM_DIR}"
          cp -R artifacts/release-macos-aarch64-apple-darwin/* "${MAC_ARM_DIR}/"
          chmod +x "${MAC_ARM_DIR}/patch_player"
          cp artifacts/vsix-darwin-arm64/*.vsix "${MAC_ARM_DIR}/" || true
          cp scripts/macos-unquarantine.sh "${MAC_ARM_DIR}/"
          chmod +x "${MAC_ARM_DIR}/macos-unquarantine.sh"
          stage_common "${MAC_ARM_DIR}"
          tar -czf "${MAC_ARM_DIR}.tar.gz" "${MAC_ARM_DIR}"

          # macOS x86_64
          MAC_X64_DIR="patches-${VERSION_BARE}-macos-x86_64"
          mkdir -p "${MAC_X64_DIR}"
          cp -R artifacts/release-macos-x86_64-apple-darwin/* "${MAC_X64_DIR}/"
          chmod +x "${MAC_X64_DIR}/patch_player"
          cp artifacts/vsix-darwin-x64/*.vsix "${MAC_X64_DIR}/" || true
          cp scripts/macos-unquarantine.sh "${MAC_X64_DIR}/"
          chmod +x "${MAC_X64_DIR}/macos-unquarantine.sh"
          stage_common "${MAC_X64_DIR}"
          tar -czf "${MAC_X64_DIR}.tar.gz" "${MAC_X64_DIR}"

          # MSI shipped alongside the zip on stable releases — skipped
          # on prerelease tags, so guard the copy.
          if [ -d artifacts/release-windows-msi ]; then
            cp artifacts/release-windows-msi/*.msi .
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            patches-*-windows-x86_64.zip
            patches-*-windows-x86_64.msi
            patches-*-macos-aarch64.tar.gz
            patches-*-macos-x86_64.tar.gz
          generate_release_notes: true
