name: CI (push tier)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  push-tier:
    name: just push
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: extractions/setup-just@v2
      - name: just push
        run: just push

  smoke-tier:
    name: just smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: extractions/setup-just@v2
      - name: just smoke
        run: just smoke
