[workspace]
members = [
    "patches-core",
    "patches-sdk",
    "patches-diagnostics",
    "patches-dsl",
    "patches-dsp",
    "patches-interpreter",
    "patches-modules",
    "patches-engine",
    "patches-planner",
    "patches-cpal",
    "patches-host",
    "patches-integration-tests",
    "patches-player",
    "patches-tools",
    "patches-forbidden-edges",
    "patches-manifest",
    "patches-profiling",
    "patches-clap",
    "patches-plugin-common",
    "patches-lsp",
    "patches-svg",
    "patches-graph-json",
    "patches-observation",
    "patches-io-ring",
    "patches-ffi",
    "patches-ffi-common",
    "patches-alloc-trap",
    "test-plugins/gain",
    "test-plugins/gain-bad-hash",
    "test-plugins/all-tags",
    "test-plugins/release-on-update",
    "test-plugins/structural-string",
    "test-plugins/disc-ports",
]
# Shelved WASM crates — excluded from build. See adr/0027-wasm-module-loading.md.
# "patches-wasm-sdk",
# "patches-wasm",
# "examples-wasm/wavefolder-rs",
resolver = "2"

[profile.release]
debug = 1  # line-level debug info for profiling symbols

# Dev/test: shrink link inputs. Backtraces still resolve (line tables kept).
# Upstream deps drop all debug info — saves the bulk of DWARF in test bins.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
