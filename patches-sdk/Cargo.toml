[package]
name = "patches-sdk"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
description = "Supported surface for authoring Patches modular-audio modules: Module trait, descriptors, ports, params, registry, and the export_modules! macro."
license = "MIT"
repository = "https://github.com/Vulpus-Labs/patches"
readme = "README.md"
keywords = ["audio", "modular", "synthesizer", "plugin", "music"]
categories = ["multimedia::audio", "api-bindings"]

[dependencies]
patches-core = { path = "../patches-core", version = "0.7" }
patches-ffi-common = { path = "../patches-ffi-common", version = "0.1" }

[features]
test-support = ["patches-core/test-support"]

[lib]
name = "patches_sdk"
path = "src/lib.rs"
doctest = false
