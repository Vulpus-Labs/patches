[package]
name = "patches-svg"
version = "0.1.0"
edition = "2021"
description = "SVG renderer for Patches DSL FlatPatch graphs"
publish = false

[lib]
name = "patches_svg"
path = "src/lib.rs"

[dependencies]
patches-core = { path = "../patches-core" }
patches-dsl = { path = "../patches-dsl" }
patches-manifest = { path = "../patches-manifest" }
rust-sugiyama = "0.4"

[dev-dependencies]
quick-xml = "0.36"
insta = "1"
